name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v0.2.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write
  packages: write
  models: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Prepare metadata & changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist in this repository"
            exit 1
          fi
          git checkout --detach "refs/tags/${TAG}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          IS_PRE="false"
          case "$TAG" in
            *-*) IS_PRE="true" ;;
          esac
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "previous_tag=${PREV}"
            echo "is_prerelease=${IS_PRE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG}, previous=${PREV:-<none>}, prerelease=${IS_PRE}"

      - name: Collect commit log since previous tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PREV: ${{ steps.resolve.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="$TAG"
          fi
          git log --no-merges --pretty=format:'* %h %s (%an)' "$RANGE" > commits.txt
          echo "--- commits ---"
          cat commits.txt
          echo
          echo "--- total lines: $(wc -l < commits.txt) ---"

      - name: Generate changelog via GitHub Models (Copilot)
        id: changelog
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          max-tokens: 2000
          system-prompt: |
            You are a release-notes assistant for go-meshtastic-serial2tcp —
            a Go service that bridges Meshtastic serial devices to TCP clients.

            Turn the raw git log into polished release notes in
            GitHub-flavored Markdown. Rules:

            - Group items under these sections (omit empty ones):
              ### Features, ### Fixes, ### Performance, ### Refactor,
              ### Tests, ### Documentation, ### Build & CI, ### Chores, ### Other.
            - Rewrite each bullet as a concise, user-facing sentence in
              imperative/present tense.
            - Keep the short SHA at the end of each bullet in backticks, e.g. `` `abc1234` ``.
            - Drop pure noise: merge commits, dependency auto-bumps with no impact,
              "wip", commits that are later fully reverted in the same range.
            - Do NOT invent changes that are not present in the log.
            - Output Markdown only, no preamble, no trailing commentary, and
              do not wrap the whole output in a code fence.
          prompt-file: commits.txt

      - name: Write changelog to file
        if: always()
        env:
          NOTES: ${{ steps.changelog.outputs.response }}
          AI_OUTCOME: ${{ steps.changelog.outcome }}
        run: |
          set -euo pipefail
          : > release-notes.md
          if [ -n "${NOTES:-}" ]; then
            printf '%s' "$NOTES" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "::warning::AI changelog unavailable (outcome=${AI_OUTCOME:-missing}) — falling back to raw commit list"
            {
              echo "### Changes"
              echo
              if [ -s commits.txt ]; then
                cat commits.txt
              else
                echo "_No commits found in range._"
              fi
            } > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
          if-no-files-found: error

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          ARCH_SUFFIX="${GOARCH}"
          if [ -n "${GOARM:-}" ]; then
            ARCH_SUFFIX="${GOARCH}v${GOARM}"
          fi
          NAME="go-meshtastic-serial2tcp_${TAG}_${GOOS}_${ARCH_SUFFIX}"
          BIN="${NAME}${EXT}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN}" .

          cd dist
          if [ "${GOOS}" = "windows" ]; then
            zip -q "${NAME}.zip" "${BIN}"
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          else
            tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "${BIN}"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          rm -f "${BIN}"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Build & push Docker image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ needs.prepare.outputs.is_prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    name: Publish GitHub release
    needs: [prepare, build-binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: List artifacts
        run: ls -la dist notes

      - name: Assemble final release body
        id: body
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREV: ${{ needs.prepare.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            cat notes/release-notes.md
            echo
            echo
            echo "## Docker images"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${REPO}:${VERSION}"
            if [ "${{ needs.prepare.outputs.is_prerelease }}" = "false" ]; then
              echo "docker pull ghcr.io/${REPO}:latest"
            fi
            echo '```'
            echo
            echo "Supported platforms: \`linux/amd64\`, \`linux/arm64\`."
            echo
            if [ -n "$PREV" ]; then
              echo "**Full diff:** https://github.com/${REPO}/compare/${PREV}...${TAG}"
            fi
          } > body.md
          echo "path=$(pwd)/body.md" >> "$GITHUB_OUTPUT"
          echo "--- final release body ---"
          cat body.md

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: ${{ steps.body.outputs.path }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
